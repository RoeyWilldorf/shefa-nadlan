# Cloudflare Workers deployment for שפע נדל״ן
# Deploy: npx wrangler deploy   (builds first, then uploads)
# D1 database and KV namespace are created automatically on the first deploy.
name = "shefa-nadlan"
main = "dist/server/standalone.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Keep variables/secrets added in the Cloudflare dashboard when deploying from GitHub.
keep_vars = true

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "shefa-nadlan-db"

[[kv_namespaces]]
binding = "FILES"

[observability]
enabled = true

# Cloudflare Workers AI (free daily allowance) - writes marketing copy in the office.
[ai]
binding = "AI"

# Optional public settings (not secrets). Fill in and redeploy to enable:
# GOOGLE_SITE_VERIFICATION - the "content" value from Google Search Console's HTML-tag method
# CF_ANALYTICS_TOKEN       - the token from Cloudflare Web Analytics
# SITE_INDEXING = "off"    - hides the site from Google
# RESEND_API_KEY is a Secret (set in the Cloudflare dashboard), never here.
[vars]
NOTIFY_EMAIL = "roivil13@gmail.com"
